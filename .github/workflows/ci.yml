name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Optional libs exercised by Phase 2/3 tests (skip-gated if absent):
          pip install cryptography python-docx openpyxl reportlab ruff

      - name: Lint (ruff — errors only)
        run: ruff check app --select F,E7

      - name: Run tests
        run: python -m pytest -q
